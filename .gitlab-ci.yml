# Converted from GitHub Actions — ukm (Unified Kernel Manager)
# Mirrors: ci.yml, integration.yml, ppa-upload.yml

stages:
  - secret-scan
  - test
  - integration
  - release

default:
  image: ubuntu:22.04

# ── CI ────────────────────────────────────────────────────────────────────────
test:
  stage: test
  before_script:
    - apt-get update -qq && apt-get install -y shellcheck
  script:
    - |
      failed=0
      for f in $(find . -name "*.sh" ! -path "./.git/*"); do
        bash -n "$f" || { echo "FAIL syntax: $f"; failed=1; }
        shellcheck --severity=warning "$f" || { echo "FAIL shellcheck: $f"; failed=1; }
      done
      exit $failed
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ── Integration (allowed to fail — needs kernel build env) ────────────────────
integration:
  stage: integration
  allow_failure: true
  script:
    - echo "Integration tests require a kernel build environment — skipped in shared CI"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ── PPA upload (on tag) ───────────────────────────────────────────────────────
# Requires CI variable: PPA_GPG_KEY (base64-encoded GPG private key)
# and PPA_TARGET (e.g. ppa:yourname/yourppa)
ppa-upload:
  stage: release
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends devscripts dput gnupg
    - echo "$PPA_GPG_KEY" | base64 -d | gpg --batch --import || true
  script:
    - debuild -S -sa || true
    - dput "$PPA_TARGET" ../*.changes || true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'

# ── GitLab Release ────────────────────────────────────────────────────────────
gitlab-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: '$CI_COMMIT_TAG'
    description: 'ukm $CI_COMMIT_TAG'
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'

secret-scan:
  stage: secret-scan
  image: python:3.12-slim
  before_script:
    - pip install git-filter-repo --quiet
  script:
    - |
      echo "Scanning commit history for leaked GitLab PATs..."
      git log --all -p | grep -E "glpat-[A-Za-z0-9_-]{20,}" && echo "LEAKED TOKEN DETECTED" && exit 1 || echo "No leaked tokens found."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^(main|master)$/'
